name: Deploy PhatGym CI/CD

# Tự động chạy khi có code mới được Push lên nhánh main
on:
  push:
    branches:
      - main # Sửa thành master nếu kho của bạn dùng nhánh master

jobs:
  deploy:
    # Báo cho GitHub biết phải chuyển lệnh về con Orange Pi
    runs-on: self-hosted

    steps:
      - name: 📥 Kéo code mới nhất từ GitHub
        uses: actions/checkout@v4

      - name: 🚀 Build và Khởi động lại PhatGym
        run: |
          # --- PHẦN NÀY TÙY THUỘC VÀO CÁCH BẠN CHẠY DOCKER ---
          # Ví dụ nếu bạn dùng docker-compose:
          docker compose down
          docker compose up -d --build
          
          # Hoặc nếu bạn dùng lệnh docker thuần:
          # docker build -t opengym_app .
          # docker stop opengym || true
          # docker rm opengym || true
          # docker run -d --name opengym -p 8080:80 opengym_app

      - name: ✅ Thông báo Telegram (Khi Deploy Thành công)
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="✅ Tuyệt vời! Đã deploy PhatGym phiên bản mới thành công lên Orange Pi."

      - name: ❌ Thông báo Telegram (Khi Deploy Thất bại)
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ Lỗi rồi! Quá trình deploy PhatGym thất bại. Vui lòng vào GitHub kiểm tra lại Log. "